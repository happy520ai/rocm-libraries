TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict] # gfx950 only

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  SleepPercent: 50
  NumElementsToValidate: -1
  # The kernel applies alpha and beta, so validate with neither of them neutral.
  DataInitTypeBeta: 2
  DataInitTypeAlpha: 2
  DataInitTypeA: 3
  DataInitTypeB: 3
  CSVExportWinner: true
  CSVMergeSameProblemID: true
  Device: 0
  PrintSolutionRejectionReason: True
  ValidateMetadata: True
  # The client pre-swizzles the MX scales for solutions that declare HostPreSwizzle.
  MXScaleFormat: 1

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F8
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: true
      TransposeB: false
      UseBeta: True
      Batched: True
      UseBias: 0
      Activation: False
      UseScaleAlphaVec: 0
      MXBlockA: 32
      MXBlockB: 32

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - CustomKernel:
          - name: "gemm_BM4_TN4_LANES_K16_WAVES2_UP_ITERS0_PARTIAL_STEPS1_PF1_GROUP1_NUM_XCDS1_GRID_3D1_USE_BETA1"
            args: [ { type: address, semantic: AddressD },
                    { type: address, semantic: AddressA },
                    { type: address, semantic: AddressB },
                    { type: address, semantic: AddressMXScaleA },
                    { type: address, semantic: AddressMXScaleB },
                    { type: uint64, semantic: ConstantZero },
                    { type: address, semantic: AddressC },
                    { type: int32, semantic: StrideD0 },
                    { type: int32, semantic: StrideA0 },
                    { type: int32, semantic: StrideB0 },
                    { type: int32, semantic: SizeFree0 },
                    { type: int32, semantic: SizeFree1 },
                    { type: int32, semantic: SizeSum },
                    { type: int32, semantic: SizeSum },
                    { type: int32, semantic: StrideC0 },
                    { type: float32, semantic: Alpha },
                    { type: float32, semantic: Beta },
                    { type: int32, semantic: NumWorkGroupsX },
                    { type: int32, semantic: NumWorkGroupsY },
                    { type: int32, semantic: NumWorkGroupsZ } ]
            # Wide tiles (over max(M, N)) on grid x and skinny tiles (over min(M, N)) on grid y, so one
            # configuration serves skinny n and skinny m.
            macrotile: [32, 4, 1024]
            threads: [128, 1, 1]
            grid: [TilesWide, TilesSkinny, Batch]
        - MatrixInstruction:
          - [16, 16, 16, 1, 1, 1, 1, 2, 1]
        - StaggerU: [0]
        # The kernel reads the scales in the gfx950 pre-swizzled layout.
        - MXScaleFormat: [HostPreSwizzle]
        # batch == 1: the kernel has no batch stride arguments.
        - AssertSizeEqual: [{2: 1}]
        # Unit element strides along K for A and B and along m for C and D; the leading dimensions are kernargs.
        - AssertStrideAEqual: [{0: 1}]
        - AssertStrideBEqual: [{0: 1}]
        - AssertStrideCEqual: [{0: 1}]
        - AssertStrideDEqual: [{0: 1}]
        # The fp8 loads read whole dwords of the A and B columns: lda % 4 == 0 and ldb % 4 == 0.
        - AssertStrideAMultiple: [{1: 4}]
        - AssertStrideBMultiple: [{1: 4}]
        # Positive sizes, so that a zero-size problem never launches an empty grid.
        - AssertSizeGreaterThan: [{0: 0, 1: 0, 3: 0}]
        # Both extents at most 2^20 (kernel limit on the wide one); the skinny extent is otherwise unconstrained.
        - AssertSizeLessThan: [{0: 1048577, 1: 1048577}]
        # The Range boxes were derived over K a multiple of 256; the kernel itself takes any K.
        - AssertSummationElementMultiple: [256]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [51200, 4, 1, 5120]
          - Exact: [151936, 2, 1, 5120]
          - Exact: [128256, 3, 1, 8192]
          - Exact: [20001, 1, 1, 2304]
          - Exact: [16385, 3, 1, 5376]
          - Exact: [106496, 2, 1, 16384]
          - Exact: [51200, 1, 1, 5120]
          - Exact: [4096, 5, 1, 5120]
          - Exact: [4097, 8, 1, 2304]
          - Exact: [4, 51200, 1, 5120]
          - Exact: [2, 151936, 1, 5120]
          - Exact: [3, 128256, 1, 8192]
          - Exact: [1, 20001, 1, 2304]
          - Exact: [3, 16385, 1, 5376]
          - Exact: [2, 106496, 1, 16384]
          - Exact: [1, 51200, 1, 5120]
          - Exact: [5, 4096, 1, 5120]
          - Exact: [8, 4097, 1, 2304]

LibraryLogic:
    ScheduleName: "gfx950"
    DeviceNames: ["Device 75a0"]
    ArchitectureName: "gfx950"
    LibraryType: "GridBased"
